<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login — Kolidiscope</title>
    <meta name="description" content="Log in to the Kolidiscope platform.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:;">
    <meta property="og:title" content="Client Login — Kolidiscope">
    <meta property="og:description" content="Secure access to the Kolidiscope platform for data vendors.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.kolidiscope.com/login">
    <meta property="og:image" content="https://www.kolidiscope.com/og-image.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2236;
            --accent: #00d4ff;
            --accent-dim: #0099b8;
            --accent-glow: rgba(0, 212, 255, 0.15);
            --text-primary: #e8edf5;
            --text-secondary: #8892a4;
            --border: #1e2a3a;
            --gradient-1: linear-gradient(135deg, #00d4ff 0%, #7b61ff 100%);
        }
        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .login-page::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .login-logo {
            margin-bottom: 2.5rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .login-logo img {
            height: 40px;
            width: auto;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gradient-1);
        }

        .login-card h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            letter-spacing: -0.02em;
        }

        .login-card .subtitle {
            color: var(--text-secondary);
            font-size: 0.88rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #4a5568;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.82rem;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .form-options label input[type="checkbox"] {
            accent-color: var(--accent);
        }

        .form-options a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .form-options a:hover { text-decoration: underline; }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            background: var(--gradient-1);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow 0.25s, transform 0.25s;
        }

        .btn-login:hover {
            box-shadow: 0 0 24px rgba(0, 212, 255, 0.35);
            transform: translateY(-1px);
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--text-secondary);
            font-size: 0.78rem;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .sftp-link {
            display: block;
            text-align: center;
            padding: 0.65rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }

        .sftp-link:hover {
            border-color: var(--accent-dim);
            color: var(--accent);
            background: var(--accent-glow);
        }

        .sftp-link span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .login-footer {
            margin-top: 2rem;
            text-align: center;
        }

        .login-footer a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.82rem;
            transition: color 0.2s;
        }

        .login-footer a:hover { color: var(--accent); }

        .login-footer span { color: #3a4556; margin: 0 0.5rem; }

        /* Placeholder notice */
        .placeholder-notice {
            margin-top: 1.5rem;
            padding: 0.75rem 1rem;
            background: rgba(123, 97, 255, 0.08);
            border: 1px solid rgba(123, 97, 255, 0.15);
            border-radius: 8px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-secondary);
            display: none; /* Hidden by default — remove display:none when live */
        }

        @media (max-width: 480px) {
            .login-card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

<div class="login-page">
    <a href="/" class="login-logo">
        <img src="/logo.png" alt="Kolidiscope" style="filter: brightness(0) invert(1);">
    </a>

    <div class="login-card">
        <h1>Sign in</h1>
        <p class="subtitle">Access the Kolidiscope platform</p>

        <form onsubmit="return false;">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
            </div>
            <div class="form-options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#" data-ct="link">Forgot password?</a>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="login-divider">or</div>

        <a href="/sftp" class="sftp-link">Secure Data Upload via <span>SFTP</span></a>
    </div>

    <div class="login-footer">
        <a href="/">Home</a>
        <span>&middot;</span>
        <a href="/security">Security</a>
        <span>&middot;</span>
        <a href="/privacy">Privacy</a>
        <span>&middot;</span>
        <a href="#" data-ct="link">Support</a>
    </div>
</div>


<script>
(function(){var u='info',d='kolidiscope.com',e=u+'@'+d,m='mail'+'to:'+e;document.querySelectorAll('a[data-ct]').forEach(function(a){a.href=m;if(a.dataset.ct==='show')a.textContent=e;});})();
</script>
</body>
</html>
